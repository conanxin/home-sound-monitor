<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>家声 HomeSound</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #172033;
      }

      main {
        width: min(560px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        line-height: 1.7;
        color: #4b5565;
      }

      audio {
        width: 100%;
        margin: 18px 0;
      }

      button {
        width: 100%;
        height: 64px;
        border: 0;
        border-radius: 8px;
        background: #1769aa;
        color: white;
        font-size: 20px;
        font-weight: 700;
      }

      #status {
        min-height: 28px;
        font-size: 15px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #10131a;
          color: #f2f5f9;
        }

        p {
          color: #c8d0dc;
        }

        button {
          background: #4da3ff;
          color: #07111f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>家声 HomeSound</h1>
      <p>打开家里的摄像头麦克风，把多个房间的声音合成一路，在手机浏览器里持续监听。</p>
      <audio id="player" controls preload="none"></audio>
      <button id="start">开始监听</button>
      <p id="status">等待开始</p>
    </main>

    <script>
      const player = document.getElementById("player");
      const start = document.getElementById("start");
      const status = document.getElementById("status");

      start.addEventListener("click", async () => {
        player.src = `/stream.mp3?ts=${Date.now()}`;
        await player.play();
        start.hidden = true;
        status.textContent = "正在监听";
      });

      player.addEventListener("error", () => {
        status.textContent = "播放失败，请检查服务端和摄像头连接";
        start.hidden = false;
      });
    </script>
  </body>
</html>
